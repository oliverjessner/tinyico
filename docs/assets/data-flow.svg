<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="818" viewBox="0 0 720 818" role="img" aria-labelledby="title description">
<title id="title">Extract one image</title>
<desc id="description">Read ICO/CUR headers and select an entry without decoding other images. PNG entries are validated and passed through unchanged. DIB entries are decoded to RGBA and encoded as PNG.</desc>
<rect width="720" height="818" fill="#fff"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#172538">
<text x="32" y="52" font-size="34" font-weight="600">Extract one image</text><rect x="32" y="88" width="656" height="132" rx="12" fill="#f2f5f9"/><text x="360" y="131" font-size="28" text-anchor="middle" font-weight="600">ICO / CUR buffer</text><text x="360" y="168" font-size="28" text-anchor="middle">One file, multiple image entries</text><path d="M360 220V256M354 248L360 256L366 248" fill="none" stroke="#526074" stroke-width="2"/><rect x="32" y="256" width="656" height="132" rx="12" fill="#f2f5f9"/><text x="360" y="299" font-size="28" text-anchor="middle" font-weight="600">Read headers · choose entry</text><text x="360" y="336" font-size="28" text-anchor="middle">No pixel decoding at this stage</text><path d="M360 388V412H188V440M360 412H532V440" fill="none" stroke="#526074" stroke-width="2"/><rect x="32" y="440" width="312" height="132" rx="12" fill="#f2f5f9"/><text x="188" y="483" font-size="28" text-anchor="middle" font-weight="600">PNG entry</text><text x="188" y="520" font-size="28" text-anchor="middle">Validate chunks</text><text x="188" y="552" font-size="28" text-anchor="middle">Pass bytes through</text><rect x="376" y="440" width="312" height="132" rx="12" fill="#f2f5f9"/><text x="532" y="483" font-size="28" text-anchor="middle" font-weight="600">DIB entry</text><text x="532" y="520" font-size="28" text-anchor="middle">Decode RGBA</text><text x="532" y="552" font-size="28" text-anchor="middle">Encode PNG</text><path d="M188 572V600H532V572M360 600V636" fill="none" stroke="#526074" stroke-width="2"/><rect x="32" y="636" width="656" height="132" rx="12" fill="#f2f5f9"/><text x="360" y="679" font-size="28" text-anchor="middle" font-weight="600">PNG buffer</text><text x="360" y="716" font-size="28" text-anchor="middle">PNG passthrough may share input memory</text><text x="32" y="802" font-size="28" >Only the selected entry is processed.</text>
</g>
</svg>
